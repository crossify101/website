  <style>
    /* Page-specific layout for the not-found page */
    .not-found {
      max-width: 640px;
      margin: 0 auto;
      padding: clamp(56px, 10vw, 120px) clamp(16px, 4vw, 40px);

    }
    .not-found__mark { margin: 0 auto 24px; border-radius: 20px; box-shadow: var(--shadow); }

      line-height: 1.1;
      margin-bottom: 12px;
    }

    .not-found__links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; list-style: none; }
    .not-found__links a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(44, 31, 24, 0.14);
      background: var(--card);
      color: var(--espresso);
      font-weight: 800;
    }
    .not-found__links a:hover { background: var(--terracotta-light); border-color: transparent; text-decoration: none; }
    .not-found__links .nav__cta { background: var(--terracotta-dark); border-color: transparent; color: #fff; }
    .not-found__links .nav__cta:hover { background: var(--terracotta-ink); }
